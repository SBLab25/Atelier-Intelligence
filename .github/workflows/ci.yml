name: CI & Enterprise Security Quality Gate

on:
  push:
    branches: [main, master, develop, phase-*, feature/*]
  pull_request:
    branches: [main, master]

jobs:
  secret-scan:
    name: Zero-Secret & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Secret Scanner
        run: |
          python cji_agent/scripts/secret_scan.py --repo . --no-history

  frontend-quality:
    name: Frontend Lint, TypeCheck & Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Type Check
        working-directory: frontend
        run: npx tsc -p tsconfig.json --noEmit

      - name: Run Vitest Suite
        working-directory: frontend
        run: npm test -- --run
